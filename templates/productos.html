{% extends "layout.html" %}

{% block content %}


<div class="view-container"></div>
    <h1>Productos</h1>
    <p>{{message}}</p>
    <p>Esta es la página de productos.</p>

</div>
<div id="carouselExampleControls"
class="carousel slide mi-carrusel"
data-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="{{ url_for('static', filename='img/productos/casco.jpg') }}"
class="d-block w-100"
alt="Casco">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='img/productos/tabla.jpg') }}"
class="d-block w-100"
alt="Tabla">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='img/productos/tenis.jpg') }}"
class="d-block w-100"
alt="tenis">
</div>

</div>

<a class="carousel-control-prev"
href="#carouselExampleControls"
role="button"
data-slide="prev">

<span class="carousel-control-prev-icon"
aria-hidden="true"></span>
</a>

<a class="carousel-control-next"
href="#carouselExampleControls"
role="button"
data-slide="next">

<span class="carousel-control-next-icon"
aria-hidden="true"></span>
</a>

</div>
</div>

{% endblock %}
